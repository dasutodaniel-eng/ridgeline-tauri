name: macOS build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm install --no-audit --no-fund
      - run: npm run dist -- --target universal-apple-darwin --bundles app,dmg
      - run: ditto -c -k src-tauri/target/universal-apple-darwin/release/bundle/macos/Ridgeline.app Ridgeline-macOS-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ridgeline-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Ridgeline-macOS-universal.app.zip
